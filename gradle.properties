# Gradle build settings for the Dice Roll app.

# Memory given to the Gradle daemon. 2 GB is plenty for a small app like this.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build faster by using all CPU cores and reusing build outputs.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is the modern Android support library (required by Jetpack Compose).
android.useAndroidX=true

# Each library generates its own R class (fewer duplicate resources).
android.nonTransitiveRClass=true

# Official Kotlin code style (used by the IDE formatter).
kotlin.code.style=official
